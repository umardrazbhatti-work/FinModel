# Stretch: every H=12 discovery-pass rule, rescored at 24h hold.
# Set was locked by prior waves; this does not invent new rules.

project:
  name: rules-w12-h24
  seed: 42

data:
  data_dir: data/aligned
  pair: EURUSD
  tf: 1h
  cost: 0.0001

walk_forward:
  min_train_bars: 5000
  val_bars: 1000
  test_bars: 1000
  step_bars: 1500
  purge_bars: 24
  mode: expanding
  max_folds: 6

signal:
  module: 1
  experiment: rule_factory
  wave: 12
  only_discovery_pass: true
  hold_override: 24
  periods_per_year: 6048
  start_usd: 100.0
  unseen_months: 6

evaluation:
  min_mean_expectancy: 0.0
  min_frac_folds: 0.5
  max_pct_flat: 0.95
  min_discovery_active: 20
  min_unseen_active: 25
  min_months_green: 4

output:
  dir: outputs
  experiment_name: exp_rules_w12_h24
